model = "gpt-5"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.stripe]
url = "https://mcp.stripe.com"
bearer_token_env_var = "STRIPE_TOKEN"

[mcp_servers.leaky]
url = "https://leaky.example.com/mcp"
enabled = false
[mcp_servers.leaky.http_headers]
Authorization = "Bearer ghp_abcdefghijklmnopqrstuvwxyz0123456789"
