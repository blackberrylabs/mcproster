<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- MCProster: a roster — three servers called out, one of them twice. Same dark tile
       family as Cleanator; the orange dot is the app's "look at this" colour. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#171a22"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- rows of the roster -->
  <g fill="#e9ebf1">
    <rect x="44" y="60" width="26" height="26" rx="7"/>
    <rect x="84" y="66" width="128" height="14" rx="7" opacity="0.92"/>
    <rect x="44" y="115" width="26" height="26" rx="7"/>
    <rect x="84" y="121" width="96" height="14" rx="7" opacity="0.92"/>
    <rect x="44" y="170" width="26" height="26" rx="7"/>
    <rect x="84" y="176" width="112" height="14" rx="7" opacity="0.92"/>
  </g>
  <!-- the same server, declared twice: two ticks on the middle row -->
  <g fill="none" stroke="#171a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 73 l6 6 l11 -12"/>
    <path d="M50 128 l6 6 l11 -12"/>
    <path d="M50 183 l6 6 l11 -12"/>
  </g>
  <circle cx="196" cy="128" r="12" fill="#eb6834"/>
  <circle cx="222" cy="128" r="12" fill="#eb6834" opacity="0.55"/>
</svg>
